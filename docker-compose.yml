services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: blink
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blink"]
      interval: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    build: ./backend
    environment: &backend_env
      BLINK_ENV: ${BLINK_ENV:-development}
      DATABASE_URL: postgresql+psycopg://blink:${POSTGRES_PASSWORD}@db:5432/blink
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      STUDIO_ORIGIN: ${STUDIO_ORIGIN:-}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      MEDIA_ROOT: /data/media
      QRIS_PATH: /app/assets/qris-nanzera.jpg
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-ap-southeast-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      REALESRGAN_BINARY: /opt/realesrgan/bin/realesrgan-ncnn-vulkan
      REALESRGAN_MODELS: /opt/realesrgan/models
    command: ['alembic','upgrade','head']
    depends_on:
      db: {condition: service_healthy}
    restart: 'no'
  backend:
    build: ./backend
    environment: *backend_env
    volumes:
      - private_media:/data/media
      - ${AI_MODELS_DIR:-./infra/ai-models}:/opt/realesrgan:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD','python','-c','import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3).read()']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
  worker:
    build: ./backend
    environment: *backend_env
    command: ["python","-m","app.worker"]
    volumes:
      - private_media:/data/media
      - ${AI_MODELS_DIR:-./infra/ai-models}:/opt/realesrgan:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    # Production GPU/Vulkan host must make a suitable device available to this container.
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend: {condition: service_healthy}
    ports:
      - "3000:3000"
    restart: unless-stopped
volumes:
  db_data:
  private_media:
